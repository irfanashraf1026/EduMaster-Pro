<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EduMaster Pro</title>
    
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4F46E5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-512.png">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #F8FAFC;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        /* Install Banner / Button Style */
        #installBanner {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #4F46E5;
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 9999;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Google Apps Script Web App loaded seamlessly inside iframe -->
    <!-- APNA APPS SCRIPT /EXEC URL YAHAN PASTE KAREIN -->
    <iframe id="appFrame" src="https://script.google.com/macros/s/PASTE_YOUR_DEPLOYMENT_ID/exec" allow="camera; microphone; clipboard-write"></iframe>

    <!-- Install App Button (Auto shows when PWA is installable) -->
    <button id="installBanner">📱 Install EduMaster Pro</button>

    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(function(err) {
                console.log('SW registration failed: ', err);
            });
        }

        // Handle PWA Installation Prompt
        let deferredPrompt;
        const installBtn = document.getElementById('installBanner');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'flex';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
            console.log('PWA was installed');
        });
    </script>
</body>
</html>
