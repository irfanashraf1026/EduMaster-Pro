<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EduMaster Pro</title>
    
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4F46E5">
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #F8FAFC; }
        iframe { width: 100%; height: 100%; border: 0; display: block; }
    </style>
</head>
<body>
    <!-- YAHAN APNA GAS WEB APP LINK PASTE KAREIN (jo /exec par khatam hota hai) -->
    <iframe src="YAHAN_APNA_GAS_LINK_PASTE_KAREIN" allow="camera; microphone; clipboard-read; clipboard-write"></iframe>
    
    <script>
        // Service worker register karein taake install button aaye
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
